name: release

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Test and build
        run: gradle --no-daemon -PlockpermAbis=arm64-v8a :app:testReleaseUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LockPerm-accessibility-arm64
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
